name: Automatic testing

on:
  pull_request:
    branches: [ master ]

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1

      - name: Install stuff
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]       
 
      - name: Run tests
        run: mpirun -n 2 python -m pytest --with-mpi tests/ #pytest tests/ #

      # On a single device every batch consists of consecutive samples, so bugs in how
      # batches are lined up across devices only show up with several devices
      - name: Run tests on 4 simulated devices
        env:
          XLA_FLAGS: --xla_force_host_platform_device_count=4
        run: python -m pytest tests/
